<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>猫咪图鉴 - 名录</title>
    <script src="https://modao.cc/agent-py/static/source/js/tailwindcss.3.4.3.js"></script>
    <script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.1.0.7.js"></script>
    <style>
        body { background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .phone-container { width: 375px; height: 812px; background: #f8fafc; border-radius: 40px; position: relative; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.1); border: 8px solid #1a1a1a; display: flex; flex-direction: column; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 优化：图片加载前的背景色 */
        .cat-img-placeholder {
            background-color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
        }
    </style>
</head>
<body>
<div class="phone-container">
    <!-- 头部 -->
    <div class="px-6 pt-12 pb-4 bg-white shadow-sm z-10 sticky top-0">
        <h1 class="text-xl font-black text-gray-800">校园猫咪图鉴</h1>
        <p class="text-[10px] text-gray-400 mt-1">共收录 42 位校园居民</p>
        <div class="mt-4 flex gap-2 overflow-x-auto hide-scrollbar pb-1">
            <button class="bg-gray-900 text-white px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap shadow-md">全部 (42)</button>
            <button class="bg-white border border-gray-200 text-gray-600 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap">图书馆区域</button>
            <button class="bg-white border border-gray-200 text-gray-600 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap">宿舍区</button>
            <button class="bg-white border border-gray-200 text-gray-600 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap">求领养</button>
        </div>
    </div>

    <!-- 列表内容 -->
    <div class="flex-1 overflow-y-auto hide-scrollbar p-4 pb-24">
        <div class="grid grid-cols-2 gap-4">
            
            <!-- 猫咪卡片 1: 大橘 -->
            <a class="group bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-md transition-all duration-300 active:scale-95" href="detail.html">
                <div class="relative w-full aspect-[4/3] overflow-hidden">
                    <!-- 相对路径引用 -->
                    <img class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" 
                         src="..\static\images\cats\d52d7bb9336778f016db84fa8947a51b.jpg" 
                         alt="大橘"
                         onerror="this.src='https://placehold.co/300x200/e2e8f0/94a3b8?text=No+Image'"/>
                    <!-- 状态标签 -->
                    <div class="absolute top-2 right-2 bg-green-500/90 backdrop-blur-sm text-white text-[9px] px-2 py-0.5 rounded-full font-bold shadow-sm flex items-center gap-1">
                        <span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span> 活跃
                    </div>
                </div>
                <div class="p-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-gray-800 text-sm">大橘</h3>
                            <p class="text-[10px] text-gray-400 mt-0.5 flex items-center gap-1">
                                <iconify-icon icon="ph:map-pin-simple-fill" class="text-orange-400"></iconify-icon> 图书馆台阶
                            </p>
                        </div>
                        <iconify-icon class="text-blue-500 text-lg" icon="ph:gender-male-bold" title="公"></iconify-icon>
                    </div>
                    <div class="mt-2 pt-2 border-t border-gray-50 flex justify-between items-center">
                        <span class="text-[9px] text-gray-400">1小时前出没</span>
                        <span class="text-[9px] text-orange-500 font-medium bg-orange-50 px-1.5 py-0.5 rounded">亲人</span>
                    </div>
                </div>
            </a>

            <!-- 猫咪卡片 2: 奶牛 -->
            <a class="group bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-md transition-all duration-300 active:scale-95" href="detail.html">
                <div class="relative w-full aspect-[4/3] overflow-hidden">
                    <img class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" 
                         src="..\static\images\cats\641e61d1488213e1bae2aaa5da70a4a0.jpg" 
                         alt="奶牛"
                         onerror="this.src='https://placehold.co/300x200/e2e8f0/94a3b8?text=No+Image'"/>
                     <div class="absolute top-2 right-2 bg-gray-500/80 backdrop-blur-sm text-white text-[9px] px-2 py-0.5 rounded-full font-bold shadow-sm">
                        休息中
                    </div>
                </div>
                <div class="p-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-gray-800 text-sm">奶牛</h3>
                            <p class="text-[10px] text-gray-400 mt-0.5 flex items-center gap-1">
                                <iconify-icon icon="ph:map-pin-simple-fill" class="text-orange-400"></iconify-icon> 体育馆西侧
                            </p>
                        </div>
                        <iconify-icon class="text-blue-500 text-lg" icon="ph:gender-male-bold" title="公"></iconify-icon>
                    </div>
                    <div class="mt-2 pt-2 border-t border-gray-50 flex justify-between items-center">
                        <span class="text-[9px] text-gray-400">昨日下午</span>
                        <span class="text-[9px] text-blue-500 font-medium bg-blue-50 px-1.5 py-0.5 rounded">粘人</span>
                    </div>
                </div>
            </a>

            <!-- 猫咪卡片 3: 警长 -->
            <a class="group bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-md transition-all duration-300 active:scale-95" href="detail.html">
                <div class="relative w-full aspect-[4/3] overflow-hidden">
                    <img class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" 
                         src="..\static\images\cats\b9231616b36dee649e581e02b89f5419.jpg" 
                         alt="警长"
                         onerror="this.src='https://placehold.co/300x200/e2e8f0/94a3b8?text=No+Image'"/>
                    <div class="absolute top-2 right-2 bg-green-500/90 backdrop-blur-sm text-white text-[9px] px-2 py-0.5 rounded-full font-bold shadow-sm flex items-center gap-1">
                        <span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span> 活跃
                    </div>
                </div>
                <div class="p-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-gray-800 text-sm">警长</h3>
                            <p class="text-[10px] text-gray-400 mt-0.5 flex items-center gap-1">
                                <iconify-icon icon="ph:map-pin-simple-fill" class="text-orange-400"></iconify-icon> A座教学楼
                            </p>
                        </div>
                        <iconify-icon class="text-pink-500 text-lg" icon="ph:gender-female-bold" title="母"></iconify-icon>
                    </div>
                    <div class="mt-2 pt-2 border-t border-gray-50 flex justify-between items-center">
                        <span class="text-[9px] text-gray-400">刚刚打卡</span>
                        <span class="text-[9px] text-purple-500 font-medium bg-purple-50 px-1.5 py-0.5 rounded">高冷</span>
                    </div>
                </div>
            </a>

            <!-- 猫咪卡片 4: 小橘 -->
            <a class="group bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-md transition-all duration-300 active:scale-95" href="detail.html">
                <div class="relative w-full aspect-[4/3] overflow-hidden">
                    <img class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" 
                         src="..\static\images\cats\c7ada3cf30c13086a18fd7cd794e5ce5.jpg" 
                         alt="小橘"
                         onerror="this.src='https://placehold.co/300x200/e2e8f0/94a3b8?text=No+Image'"/>
                     <div class="absolute top-2 right-2 bg-orange-500/90 backdrop-blur-sm text-white text-[9px] px-2 py-0.5 rounded-full font-bold shadow-sm">
                        绝育恢复
                    </div>
                </div>
                <div class="p-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-gray-800 text-sm">小橘</h3>
                            <p class="text-[10px] text-gray-400 mt-0.5 flex items-center gap-1">
                                <iconify-icon icon="ph:map-pin-simple-fill" class="text-orange-400"></iconify-icon> 西侧草坪
                            </p>
                        </div>
                        <iconify-icon class="text-pink-500 text-lg" icon="ph:gender-female-bold" title="母"></iconify-icon>
                    </div>
                    <div class="mt-2 pt-2 border-t border-gray-50 flex justify-between items-center">
                        <span class="text-[9px] text-gray-400">3天前</span>
                        <span class="text-[9px] text-gray-500 font-medium bg-gray-100 px-1.5 py-0.5 rounded">社恐</span>
                    </div>
                </div>
            </a>

             <!-- 猫咪卡片 5: 煤球 (失踪/特殊状态) -->
             <div class="group bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100 opacity-75 grayscale hover:grayscale-0 hover:opacity-100 transition-all duration-300">
                <div class="relative w-full aspect-[4/3] overflow-hidden">
                    <img class="w-full h-full object-cover" 
                         src="..\static\images\cats\90b8af8fe3f1982ff4d84beb7a3b3884.jpg" 
                         alt="煤球"
                         onerror="this.src='https://placehold.co/300x200/e2e8f0/94a3b8?text=No+Image'"/>
                    <div class="absolute inset-0 bg-black/10"></div>
                    <div class="absolute top-2 right-2 bg-red-500/90 backdrop-blur-sm text-white text-[9px] px-2 py-0.5 rounded-full font-bold shadow-sm">
                        寻找中
                    </div>
                </div>
                <div class="p-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-gray-800 text-sm">煤球</h3>
                            <p class="text-[10px] text-gray-400 mt-0.5 flex items-center gap-1">
                                <iconify-icon icon="ph:question-mark" class="text-red-400"></iconify-icon> 位置不明
                            </p>
                        </div>
                        <iconify-icon class="text-blue-500 text-lg" icon="ph:gender-male-bold" title="公"></iconify-icon>
                    </div>
                    <div class="mt-2 pt-2 border-t border-gray-50 flex justify-between items-center">
                        <span class="text-[9px] text-red-500 font-bold">已失踪 5 天</span>
                    </div>
                </div>
            </div>

        </div>
        
        <!-- 加载更多提示 -->
        <div class="mt-6 text-center pb-4">
            <span class="text-[10px] text-gray-400 bg-gray-100 px-3 py-1 rounded-full">没有更多猫咪了 ~</span>
        </div>
    </div>

    <!-- 底部导航 (保持不变) -->
    <div class="absolute bottom-0 w-full h-20 bg-white border-t border-gray-100 px-6 flex justify-between items-center z-50">
        <a class="flex flex-col items-center gap-1 text-gray-400" href="index.html">
            <iconify-icon class="text-2xl" icon="ri:map-2-line"></iconify-icon>
            <span class="text-[10px]">地图</span>
        </a>
        <div class="flex flex-col items-center gap-1 text-orange-500">
            <iconify-icon class="text-2xl" icon="ri:function-fill"></iconify-icon>
            <span class="text-[10px] font-bold">图鉴</span>
        </div>
        <a class="flex flex-col items-center -mt-10" href="check-in.html">
            <div class="w-14 h-14 bg-gradient-to-br from-orange-400 to-orange-500 rounded-2xl shadow-lg shadow-orange-200 flex items-center justify-center text-white text-2xl border-4 border-white">
                <iconify-icon icon="tabler:camera-plus"></iconify-icon>
            </div>
            <span class="text-[10px] mt-1 text-orange-500 font-bold">打卡</span>
        </a>
        <a class="flex flex-col items-center gap-1 text-gray-400" href="stats.html">
            <iconify-icon class="text-2xl" icon="ri:bar-chart-box-line"></iconify-icon>
            <span class="text-[10px]">看板</span>
        </a>
        <a class="flex flex-col items-center gap-1 text-gray-400" href="profile.html">
            <iconify-icon class="text-2xl" icon="ri:user-3-line"></iconify-icon>
            <span class="text-[10px]">我的</span>
        </a>
    </div>
</div>
</body>
</html>
