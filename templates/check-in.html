<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>打卡投喂 - 实时交互</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.3.4.3.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.1.0.7.js"></script>
<style>
        body { background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .phone-container { width: 375px; height: 812px; background: #000; border-radius: 40px; position: relative; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.1); border: 8px solid #1a1a1a; }
        .camera-view { background-image: url('/agent-py/static/source/images/placeholder.svg'); background-size: cover; background-position: center; width: 100%; height: 100%; position: absolute; }
        .scanner-frame { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 240px; height: 240px; border: 2px solid rgba(255,255,255,0.5); border-radius: 40px; }
        .scanner-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #fb923c, transparent); animation: scan 2s infinite linear; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .ai-label { position: absolute; background: rgba(251, 146, 60, 0.9); color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; transform: scale(0); animation: pop 0.5s forwards 1s; }
        @keyframes pop { to { transform: scale(1); } }
    </style>
</head>
<body>
<div class="phone-container">
<!-- 模拟相机视图 -->
<div class="camera-view">
<div class="absolute inset-0 bg-black/20"></div>
</div>
<!-- 扫描框 -->
<div class="scanner-frame">
<div class="scanner-line"></div>
<!-- 四角 -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-orange-400 rounded-tl-2xl"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-orange-400 rounded-tr-2xl"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-orange-400 rounded-bl-2xl"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-orange-400 rounded-br-2xl"></div>
<!-- AI识别标签 -->
<div class="ai-label top-1/2 left-full ml-4 flex items-center gap-1">
<iconify-icon icon="tabler:sparkles"></iconify-icon>
                AI 匹配: 奶牛 (98%)
            </div>
</div>
<!-- 顶部操作 -->
<div class="absolute top-12 left-0 w-full px-6 flex justify-between items-center z-20">
<a class="text-white text-3xl" href="index.html">
<iconify-icon icon="tabler:x"></iconify-icon>
</a>
<div class="bg-black/40 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/20 text-white text-xs font-medium flex items-center gap-2">
<span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                GPS 已锁定: 体育馆西侧
            </div>
<button class="text-white text-3xl">
<iconify-icon icon="tabler:bolt"></iconify-icon>
</button>
</div>
<!-- 底部模式切换与拍照 -->
<div class="absolute bottom-0 w-full h-64 bg-gradient-to-t from-black to-transparent z-20 flex flex-col items-center">
<!-- 模式选择 -->
<div class="flex gap-8 mb-8">
<button class="text-white font-bold border-b-2 border-orange-400 pb-1">偶遇打卡</button>
<button class="text-gray-400 font-medium">投喂报告</button>
<button class="text-gray-400 font-medium">状态求助</button>
</div>
<!-- 拍摄按钮 -->
<div class="flex items-center gap-10">
<button class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center text-white text-2xl">
<iconify-icon icon="tabler:photo"></iconify-icon>
</button>
<div class="w-20 h-20 rounded-full border-4 border-white flex items-center justify-center">
<div class="w-16 h-16 rounded-full bg-white active:scale-95 transition-transform"></div>
</div>
<button class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center text-white text-2xl">
<iconify-icon icon="tabler:refresh"></iconify-icon>
</button>
</div>
<p class="mt-6 text-white/60 text-[10px] tracking-widest">请确保猫咪正脸清晰可见</p>
</div>
<!-- 2026年4月22日 时间水印 -->
<div class="absolute bottom-10 left-6 text-white/30 text-[10px] pointer-events-none">
            2026-04-22 14:35:12<br/>
            CAMPUS-CAT-SYSTEM-V2.0
        </div>
</div>
</body>
</html>
